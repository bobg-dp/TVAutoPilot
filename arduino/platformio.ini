; TVAutoPilot — ESP32 BLE HID keep-alive for a TV running Netflix.
; Target is the generic esp32dev board: a common ESP32-WROOM-32 DevKit
; with BOOT on GPIO0 and the onboard LED on GPIO2.

[env:esp32dev]
platform = espressif32@6.8.1
board = esp32dev
framework = arduino
monitor_speed = 115200
; 460800 is kinder to the CH340 clones used on many DevKit boards than 921600.
upload_speed = 460800

; Arduino-ESP32 2.0.17 (this platform pin). The vendored BLE keyboard
; library does not build on Arduino-ESP32 3.x without a port, and 2.0.17
; is the core this HID stack is known to work with. Do not bump the
; platform until the library has been ported and pairing is re-checked.
